name: Downstream TUI selection observer

on:
  pull_request:
    paths:
      - ".github/workflows/tui-selection-observer.yml"
      - "codex-rs/tui/src/selection_observer.rs"
      - "codex-rs/tui/src/app/startup.rs"
      - "codex-rs/tui/src/cli.rs"
      - "codex-rs/tui/src/lib.rs"
      - "codex-rs/cli/src/main.rs"
      - "codex-rs/**/tui_handoff.rs"
      - "codex-rs/**/tui_mcp_handoff.rs"
      - "codex-rs/tui/src/dynamic_tools_mcp.rs"
      - "codex-rs/tui/src/app_server_session/**"
      - "codex-rs/core/src/session/config_refresh.rs"
      - "codex-rs/config/src/state.rs"
      - "codex-rs/uds/src/**"
      - "codex-rs/app-server/src/user_verification_rpc_tests.rs"
      - "codex-rs/app-server/src/user_verification_test_support.rs"
  workflow_dispatch:
    inputs:
      artifact_run:
        description: "Optional successful native producer run; empty builds current source"
        type: string
        default: ""
      artifact_source:
        description: "Artifact qualification: expected full native source commit"
        type: string
        default: ""
      artifact_sha256:
        description: "Artifact qualification: independently recorded binary SHA-256"
        type: string
        default: ""

permissions:
  contents: read

# A new source revision supersedes only this branch's native qualifier.
# Keep different prototype branches independent and avoid duplicate PR/manual builds.
concurrency:
  group: downstream-native-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native:
    # This is a downstream integration qualifier, not an upstream release job.
    if: github.repository != 'openai/codex' && (github.event_name != 'workflow_dispatch' || inputs.artifact_run == '')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Observe native worker and reserve build headroom
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/codex-selection-target" >> "$GITHUB_ENV"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          df -h "$RUNNER_TEMP"
          memory_pressure
          python3 - <<'PY'
          import os, pathlib, shutil
          available = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          # Source checkout, dependency checkout, compilation and retained binary.
          if available < 25 * 1024**3:
              raise SystemExit('Native build requires 25 GiB free including reserve')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'selection-receipts').mkdir()
          PY
      - name: Install the pinned native Rust toolchain
        working-directory: codex-rs
        run: rustup toolchain install 1.99.1 --profile minimal --component rust-src
      - name: Compile full TUI and test observation controls
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-tui --lib selection_observer::tests -- --nocapture 2>&1 |
            tee "$RUNNER_TEMP/selection-receipts/native-module-tests.log"
      - name: Qualify actual same-user socket peer
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-uds same_user_peer_is_verified -- --nocapture 2>&1 |
            tee "$RUNNER_TEMP/selection-receipts/handoff-local-peer.log"
      - name: Read actual native thread through replacement viewer
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-tui --lib tui_mcp_handoff_routes_a_real_read -- --nocapture 2>&1 |
            tee "$RUNNER_TEMP/selection-receipts/handoff-native-read.log"
      - name: Verify stable and experimental protocol contracts
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-app-server-protocol --lib -- --test-threads=1 2>&1 |
            tee "$RUNNER_TEMP/selection-receipts/handoff-protocol-contracts.log"
      - name: Preserve handoff configuration and reload policy
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-core --lib tui_mcp_handoff -- --nocapture 2>&1 |
            tee "$RUNNER_TEMP/selection-receipts/handoff-config-controls.log"
      - name: Refuse native handoff from network origins
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-app-server --lib tui_mcp_handoff -- --nocapture 2>&1 |
            tee "$RUNNER_TEMP/selection-receipts/handoff-network-origin-refusal.log"
      - name: Retain native verification key origin restrictions
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-app-server --lib user_verification_rpc_network_peers_cannot_use_server_keys -- --nocapture 2>&1 |
            tee "$RUNNER_TEMP/selection-receipts/handoff-origin-refusal.log"
      - name: Build the actual native CLI and verify capability
        working-directory: codex-rs
        run: |
          cargo build --locked -p codex-cli --bin codex 2>&1 |
            tee "$RUNNER_TEMP/selection-receipts/native-build.log"
          "$CARGO_TARGET_DIR/debug/codex" --help > "$RUNNER_TEMP/selection-receipts/help.txt"
          "$CARGO_TARGET_DIR/debug/codex" --version > "$RUNNER_TEMP/selection-receipts/version.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, shutil, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'selection-receipts')
          binary = pathlib.Path(os.environ['CARGO_TARGET_DIR'], 'debug/codex')
          assert '--selection-observer-fd' in (root / 'help.txt').read_text()
          digest = hashlib.sha256()
          with binary.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(chunk)
          receipt = {'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'binary_sha256': digest.hexdigest(),
                     'machine': platform.machine(), 'run': os.environ['GITHUB_RUN_ID'],
                     'native_tui_compiled': True, 'native_cli_built': True,
                     'interactive_switch_qualified': False, 'task_tool_handoff_qualified': False}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('NATIVE_BUILD_PROVENANCE ' + json.dumps({
              'source': receipt['source'], 'binary_sha256': receipt['binary_sha256'],
          }))
          shutil.copy2(binary, root / 'codex-selection-prototype')
          PY
      - name: Retain native artifact and original failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-macos-selection-prototype
          path: ${{ runner.temp }}/selection-receipts

  artifact-qualification:
    # Reuses a known producer without claiming that this workflow's source built.
    if: github.repository == 'jordanhubbard/codex' && github.event_name == 'workflow_dispatch' && inputs.artifact_run != ''
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_RUN: ${{ inputs.artifact_run }}
      EXPECTED_SOURCE: ${{ inputs.artifact_source }}
      EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
      CONSUMER_SOURCE: 171754416521aeb5248d9f4979af64b0a1b90b48
    steps:
      - name: Validate inputs and native worker
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          df -h "$RUNNER_TEMP"
          memory_pressure
          python3 - <<'PY'
          import os, pathlib, re, shutil
          for key, pattern in [('SOURCE_RUN', r'[1-9][0-9]{1,20}'), ('EXPECTED_SOURCE', r'[0-9a-f]{40}'), ('EXPECTED_SHA256', r'[0-9a-f]{64}')]:
              assert re.fullmatch(pattern, os.environ[key]), 'invalid provenance input'
          assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 25 * 1024**3
          pathlib.Path(os.environ['RUNNER_TEMP'], 'selection-qualification').mkdir()
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jordanhubbard/webmux
          ref: 171754416521aeb5248d9f4979af64b0a1b90b48
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-macos-selection-prototype
          path: ${{ runner.temp }}/selection-artifact
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Verify successful producer and exact binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          run = json.loads(subprocess.check_output(['gh', 'api', 'repos/jordanhubbard/codex/actions/runs/' + os.environ['SOURCE_RUN']]))
          assert run['conclusion'] == 'success' and run['head_sha'] == os.environ['EXPECTED_SOURCE']
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          receipt = json.loads((root / 'selection-artifact/receipt.json').read_text())
          assert receipt['source'] == os.environ['EXPECTED_SOURCE'] and str(receipt['run']) == os.environ['SOURCE_RUN']
          assert receipt['native_tui_compiled'] and receipt['native_cli_built']
          binary = root / 'selection-artifact/codex-selection-prototype'
          with binary.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert digest == receipt['binary_sha256'] == os.environ['EXPECTED_SHA256']
          binary.chmod(binary.stat().st_mode | 0o100)
          consumer = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert consumer == os.environ['CONSUMER_SOURCE']
          (root / 'selection-qualification/provenance.json').write_text(json.dumps({
              'artifact_source': receipt['source'], 'artifact_run': receipt['run'], 'binary_sha256': digest,
              'consumer_source': consumer, 'workflow_source': os.environ['GITHUB_SHA'],
              'daemon_profile': 'private managed selection of the same native artifact',
              'active_work_qualified': False, 'four_session_survival_qualified': False,
          }, indent=2) + '\n')
          PY
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
          cache-dependency-path: webmux/server/go.sum
      - name: Build actual WebMux launcher
        run: go -C webmux/server build -p 1 -o "$RUNNER_TEMP/selection-webmux" ./cmd/webmux
      - name: Qualify remote refusal and managed concurrent reconnect with host state
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          output = root / 'selection-qualification'
          binary = root / 'selection-artifact/codex-selection-prototype'
          helper = root / 'selection-webmux'
          with helper.open('rb') as stream:
              helper_hash = hashlib.file_digest(stream, 'sha256').hexdigest()
          base = ['python3', 'webmux/scripts/qualify-codex-selection.py', '--binary', str(binary), '--expected-sha256', os.environ['EXPECTED_SHA256']]
          profiles = {
              'remote-negative': ['--profile', 'remote-negative'],
              'forwarded-default': ['--profile', 'forwarded-default'],
              'managed': ['--profile', 'managed', '--companion', '--reconnect', '--host-cache',
                  '--daemon-binary', str(binary), '--daemon-sha256', os.environ['EXPECTED_SHA256'],
                  '--webmux-binary', str(helper), '--webmux-sha256', helper_hash],
          }
          failed = False
          for name, args in profiles.items():
              with (output / (name + '.log')).open('x') as log:
                  result = subprocess.run(base + args + ['--output', str(output / (name + '.json'))], stdout=log, stderr=subprocess.STDOUT)
              failed |= result.returncode != 0
          raise SystemExit(1 if failed else 0)
          PY
      - name: Retain qualification receipts and owned fixture logs
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'selection-qualification')
          for receipt in output.glob('*.json'):
              data = json.loads(receipt.read_text())
              if 'fixture_root' not in data:
                  continue
              fixture = pathlib.Path(data['fixture_root']).resolve()
              assert fixture.parent == pathlib.Path('/private/tmp') and fixture.name.startswith('wm-native-selection-')
              logs = output / (receipt.stem + '-fixture-logs')
              logs.mkdir()
              for source in fixture.glob('*.log'):
                  assert not source.is_symlink() and source.is_file()
                  shutil.copy2(source, logs / source.name)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-selection-artifact-qualification
          path: ${{ runner.temp }}/selection-qualification
