# Diagnostic-only branch for jordanhubbard/webmux#724. Never merge this workflow replacement.
name: Fence startup executable evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        version: ['pinned-0.12.2', 'released-0.13.1']
    steps:
      - name: Record worker execution preconditions
        shell: bash
        run: |
          set -eu
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          id
          uname -srmo
          systemd --version
          findmnt --target /run --output TARGET,SOURCE,FSTYPE,OPTIONS
          sudo -n namei -l /run
          sudo -n aa-status || true
      - name: Exercise original pinned audit startup
        if: matrix.version == 'pinned-0.12.2'
        uses: openai/fence@e017427978b91977d79a3023842166ab79b5b816
        with:
          mode: audit
      - name: Exercise current released audit startup
        if: matrix.version == 'released-0.13.1'
        uses: openai/fence@7cba9082252803421a0e433f29198de6d0063221
        with:
          mode: audit
      - name: Retain bounded executable and kernel evidence
        if: always()
        shell: bash
        run: |
          set -u
          id
          uname -srmo
          findmnt --target /run --output TARGET,SOURCE,FSTYPE,OPTIONS
          findmnt --target /run/fence-launcher --output TARGET,SOURCE,FSTYPE,OPTIONS || true
          sudo -n namei -l "/run/fence-launcher/fence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/action/bin/fence" || true
          sudo -n stat -c '%A %a %U:%G %n' /run /run/fence-launcher || true
          sudo -n findmnt --target "/run/fence-launcher/fence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/action/bin/fence" --output TARGET,SOURCE,FSTYPE,OPTIONS || true
          sudo -n systemctl show "fence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --property=LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus || true
          sudo -n journalctl -k --since '-5 minutes' --no-pager -n 250 | grep -Ei 'fence|apparmor|denied' || true
          sudo -n journalctl --since '-5 minutes' --no-pager -n 300 | grep -Ei 'fence.*(permission|denied|executable|failed)|apparmor.*DENIED' || true
